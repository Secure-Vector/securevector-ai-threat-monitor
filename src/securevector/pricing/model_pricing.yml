# SecureVector LLM Model Pricing Reference
# USD per 1 million tokens — official provider sources only
# DO NOT add estimated or inferred values. Omit uncertain entries.
# Use "Sync Prices" in the UI to refresh from the latest version of this file.
# Full re-verification sweep: 2026-11-17; before that 2026-08-19 (every retained price confirmed on the
# provider's official page that day; models no longer priced officially were
# removed rather than guessed).
#
# Fields per model:
#   model_id           - exact model ID string used in API requests
#   display_name       - human-readable name shown in UI
#   input_per_million  - USD per 1M input (prompt) tokens
#   output_per_million - USD per 1M output (completion) tokens
#   effective_date     - ISO date this pricing became effective (omitted when unknown)
#   verified_at        - ISO date last verified from official source
#   source_url         - official pricing page URL
#   cache_read_per_million  - optional: USD per 1M cache-read input tokens
#   cache_write_per_million - optional: USD per 1M 5-minute cache-write input tokens
#     When omitted, Claude models (on any provider) price reads at 0.1x and
#     writes at 1.25x the input rate; other providers use their cache discount.
#   long_context       - optional: rates for a request whose whole prompt (input,
#     cache reads and cache writes) is over `over_tokens`. The whole request
#     pays them. Same rate fields as above.

